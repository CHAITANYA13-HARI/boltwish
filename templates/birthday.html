<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Wish</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg,#fceabb,#f8b500);
  padding: 15px;
}

.card {
  background: #fff;
  padding: 35px 25px;
  border-radius: 25px;
  max-width: 450px;
  width: 100%;
  text-align: center;
  box-shadow: 0 15px 50px rgba(0,0,0,0.2);
  position: relative;
  overflow: hidden;
  animation: slideIn 1s ease forwards;
}

h1 {
  font-size: clamp(28px, 6vw, 36px);
  color: #ff5722;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
  line-height: 1.2;
}

.age {
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 700;
  color: #ff7043;
  margin: 10px 0 20px;
  line-height: 1.3;
}

.message-box {
  background: linear-gradient(135deg,#fff3e0,#ffe0b2);
  border-left: 6px solid #ff5722;
  padding: 15px;
  border-radius: 15px;
  margin: 15px 0;
  font-size: clamp(14px, 3vw, 16px);
  color: #6d4c41;
  line-height: 1.6;
  word-wrap: break-word;
}

.highlight {
  background: #fff8e1;
  padding: 12px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: clamp(13px,2.5vw,14px);
  font-weight: 500;
  color: #ff6f00;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  transform: rotate(-1deg);
}

.quote {
  font-size: clamp(12px,2vw,14px);
  color: #777;
  margin-top: 18px;
  font-style: italic;
}

.footer {
  margin-top: 20px;
  font-size: clamp(13px,2vw,15px);
  font-weight: 600;
  color: #333;
}

@keyframes slideIn {
  0% { opacity: 0; transform: translateY(30px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@media (max-width:480px){
  .card { padding:25px 15px; }
  h1 { font-size:28px; }
  .age { font-size:20px; }
  .message-box { font-size:14px; }
}
</style>
</head>
<body>
<div class="card">
  <h1>🎉Happy Birthday, {{name}}! 🎉</h1>
  <div class="age">It's your {{age}}'th birthday 🎂</div>
  <div class="message-box">{{message}}</div>
  <div class="highlight">✨ May your day sparkle with joy, love, and unforgettable memories! ✨</div>
  <div class="quote">"Happiness is the only thing that multiplies when you share it."</div>
  <div class="footer">~ {{from}} ❤️</div>
</div>
</body>
</html>
