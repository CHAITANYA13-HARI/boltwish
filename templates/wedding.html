<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Wish</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#ffecd2,#fcb69f);padding:15px;}
.card{background:#fff;padding:35px 25px;border-radius:25px;max-width:450px;width:100%;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,0.2);overflow:hidden;animation:slideIn 1s ease forwards;}
h1{font-size:clamp(28px,6vw,36px);color:#ad1457;margin-bottom:10px;animation:pulse 2s infinite;line-height:1.2;}
.message-box{background:linear-gradient(135deg,#fce4ec,#f8bbd0);border-left:6px solid #ad1457;padding:15px;border-radius:15px;margin:15px 0;font-size:clamp(14px,3vw,16px);color:#880e4f;line-height:1.6;word-wrap:break-word;}
.highlight{background:#fce4ec;padding:12px;border-radius:12px;margin-top:15px;font-size:clamp(13px,2.5vw,14px);font-weight:500;color:#880e4f;box-shadow:0 4px 15px rgba(0,0,0,0.05);transform:rotate(-1deg);}
.quote{font-size:clamp(12px,2vw,14px);color:#777;margin-top:18px;font-style:italic;}
.footer{margin-top:20px;font-size:clamp(13px,2vw,15px);font-weight:600;color:#333;}
@keyframes slideIn{0%{opacity:0;transform:translateY(30px) scale(0.95);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@media(max-width:480px){.card{padding:25px 15px;}h1{font-size:28px;}.message-box{font-size:14px;}}
</style>
</head>
<body>
<div class="card">
<h1>💍 Congratulations, {{bride}} & {{groom}}! 💍</h1>
<div class="message-box">{{message}}</div>
<div class="highlight">🌸 Wishing you both a lifetime full of love, laughter, and endless happiness! 🌸</div>
<div class="quote">"Chains do not hold a marriage together. It is threads, hundreds of tiny threads, which sew people together through the years." – Simone Signoret</div>
<div class="footer">~ {{from}} ❤️</div>
</div>
</body>
</html>
