<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Wish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#37202c;--muted:#7b5363;--brand:#c2185b;--paper:rgba(255,255,255,0.82);}
body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:'Manrope',sans-serif;background:radial-gradient(circle at top left,rgba(255,255,255,0.28),transparent 28%),radial-gradient(circle at bottom right,rgba(194,24,91,0.18),transparent 30%),linear-gradient(135deg,#ffd8e1 0%,#ffb9c7 50%,#ffeff3 100%);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.12) 1px,transparent 1px);background-size:36px 36px;opacity:.45;}
.card{width:min(100%,460px);padding:18px;border-radius:32px;background:rgba(255,255,255,0.24);backdrop-filter:blur(18px);box-shadow:0 28px 80px rgba(96,13,45,0.2);overflow:hidden;animation:slideIn .9s ease both;position:relative;}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;pointer-events:none;}
.card::before{inset:-70px auto auto -80px;width:180px;height:180px;background:rgba(255,255,255,0.25);}
.card::after{inset:auto -60px -80px auto;width:180px;height:180px;background:rgba(255,255,255,0.16);}
.surface{position:relative;z-index:1;padding:30px 24px 24px;border-radius:26px;background:var(--paper);border:1px solid rgba(255,255,255,0.72);text-align:center;}
.chip{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(194,24,91,0.1);color:#ad154f;font-size:.82rem;font-weight:800;letter-spacing:.02em;}
h1{margin:16px 0 10px;font-family:'Playfair Display',serif;font-size:clamp(30px,7vw,42px);line-height:1;color:var(--ink);}
.subtitle{color:var(--muted);font-size:.98rem;line-height:1.6;}
.message-box{margin:18px auto 16px;padding:18px;border-radius:20px;background:linear-gradient(180deg,#fff5f8,#ffe7ef);border:1px solid rgba(194,24,91,0.12);border-left:6px solid var(--brand);color:#643245;line-height:1.75;font-size:clamp(14px,3vw,16px);text-align:left;word-wrap:break-word;}
.highlight{margin-top:16px;padding:14px 15px;border-radius:16px;background:linear-gradient(135deg,rgba(194,24,91,0.12),rgba(255,198,218,0.3));color:#ad154f;font-weight:800;font-size:clamp(13px,2.6vw,15px);}
.quote{margin-top:16px;color:#865568;font-size:clamp(12px,2vw,14px);font-style:italic;line-height:1.5;}
.footer{margin-top:18px;color:var(--ink);font-size:clamp(13px,2.2vw,15px);font-weight:800;}
@keyframes slideIn{0%{opacity:0;transform:translateY(28px) scale(.97);}100%{opacity:1;transform:translateY(0) scale(1);}}
@media(max-width:480px){.card{padding:12px;border-radius:28px;}.surface{padding:24px 16px 18px;}}
</style>
</head>
<body>
<div class="card">
<div class="surface">
<div class="chip">💖 Love note</div>
<h1>To My Love, {{name}}</h1>
<div class="subtitle">A softer, more elegant card for romantic wishes and personal messages.</div>
<div class="message-box">{{message}}</div>
<div class="highlight">Every moment with you feels like a dream come true.</div>
<div class="quote">"Love is composed of a single soul inhabiting two bodies." – Aristotle</div>
<div class="footer">~ {{from}} ❤️</div>
</div>
</div>
</body>
</html>
