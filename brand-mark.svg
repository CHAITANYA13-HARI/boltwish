<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background card -->
  <rect x="30" y="40" width="140" height="120" rx="15" ry="15" fill="#FFD700" stroke="#FFA500" stroke-width="4"/>
  
  <!-- Lightning bolt -->
  <polygon points="90,50 110,50 100,90 120,90 80,150 90,110 70,110" fill="#1E90FF"/>
  
  <!-- Confetti dots -->
  <circle cx="50" cy="60" r="5" fill="#FF69B4"/>
  <circle cx="150" cy="80" r="5" fill="#A020F0"/>
  <circle cx="120" cy="130" r="5" fill="#FF69B4"/>
</svg>
