<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick Your Occasion</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  text-align:center;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
h1 {
  padding:40px 20px 20px 20px;
  font-size:2rem;
}
.templates {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
  flex-grow:1;
}
.card {
  background:white;
  color:black;
  border-radius:20px;
  padding:25px 15px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.3s;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.card:hover { transform:scale(1.05); box-shadow:0 15px 35px rgba(0,0,0,0.3); }
.card h2 { margin:10px 0 5px 0; font-size:1.2rem; }
.card p { font-size:0.9rem; color:#555; margin:0; }
@media(max-width:500px){
  h1 { font-size:1.6rem; padding:30px 10px 20px 10px; }
  .card { padding:20px 10px; }
}
</style>
</head>
<body>
<h1>✨ Pick a Template</h1>
<div class="templates">
  <div class="card" onclick="go('birthday')"><h2>🎂 Birthday</h2><p>Fun birthday wishes</p></div>
  <div class="card" onclick="go('anniversary')"><h2>💖 Anniversary</h2><p>Celebrate love</p></div>
  <div class="card" onclick="go('love')"><h2>❤️ Love</h2><p>Romantic wishes</p></div>
  <div class="card" onclick="go('congrats')"><h2>🎊 Congrats</h2><p>Achievement wishes</p></div>
  <div class="card" onclick="go('newbaby')"><h2>👶 New Baby</h2><p>Welcome your little one</p></div>
  <div class="card" onclick="go('wedding')"><h2>💍 Wedding</h2><p>Celebrate the couple</p></div>
  <div class="card" onclick="go('friendship')"><h2>🤗 Friendship</h2><p>Wishes for friends</p></div>
  <div class="card" onclick="go('thankyou')"><h2>🙏 Thank You</h2><p>Express gratitude</p></div>
</div>

<script>
function go(template){ location.href = `form.html?template=${template}`; }
</script>
</body>
</html>
