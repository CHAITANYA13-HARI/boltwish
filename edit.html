<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  text-align:center;
  padding:40px 15px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  color:white;
}

/* CARD PREVIEW */
#preview {
  margin:30px auto;
  max-width:450px;
  width:100%;
  padding:35px 25px;
  border-radius:25px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  text-align:center;
  transition: transform 0.3s;
}
#preview:hover { transform: scale(1.02); }

/* EDITABLE FIELDS */
[contenteditable]{
  border-bottom:2px dashed rgba(255,255,255,0.7);
  padding:2px 6px;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
  background: rgba(255,255,255,0.05);
  border-radius:5px;
  display:inline-block;
  min-width: 50px;
}
[contenteditable]:focus{
  outline:none;
  border-color:#fff;
  box-shadow:0 0 8px rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.15);
}

/* BUTTON */
button{
  margin-top:20px;
  background: linear-gradient(135deg,#ff7eb3,#ff758c);
  padding:14px 30px;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  font-size:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition: transform 0.3s, opacity 0.3s;
}
button:hover { transform: translateY(-3px); opacity:0.9; }

/* HEADER */
h2 {
  font-weight:700;
  font-size:clamp(22px,5vw,28px);
  margin-bottom:15px;
}

/* MOBILE RESPONSIVE */
@media (max-width:480px){
  #preview { padding:25px 15px; }
  h2 { font-size:20px; }
  button { width:100%; font-size:16px; padding:12px; }
}
</style>
</head>
<body>

<h2>Edit Your Wish ✏️</h2>
<div id="preview"></div>
<button onclick="finish()">Finish ✅</button>

<script>
const data = JSON.parse(localStorage.getItem("userData"));
if(!data){ location.href="form.html"; }

async function load(){
  try {
    const res = await fetch(`templates/${data.template}.html`);
    let html = await res.text();
    Object.keys(data).forEach(key=>{
      if(key !== "template") {
        html = html.replace(new RegExp(`{{${key}}}`,'g'), `<span class="${key}" contenteditable>${data[key]}</span>`);
      }
    });
    document.getElementById("preview").innerHTML = html;
  } catch(e) {
    document.getElementById("preview").innerHTML = "<p style='color:white;'>Error loading template.</p>";
    console.error(e);
  }
}

function finish(){
  const finalData = {};
  Object.keys(data).forEach(key=>{
    if(key!=="template"){
      const el = document.querySelector(`.${key}`);
      finalData[key] = el ? el.innerText.trim() : "";
    }
  });
  finalData.template = data.template;
  localStorage.setItem("finalData", JSON.stringify(finalData));
  location.href="save.html";
}

load();
</script>

</body>
</html>
