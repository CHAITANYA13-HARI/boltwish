<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Details</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="brand-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand-mark.svg">
  <meta name="theme-color" content="#e85d04">
<style>
:root {
  --bg: #fffaf4;
  --panel: rgba(255,255,255,0.88);
  --text: #1f2937;
  --muted: #6b7280;
  --brand: #e85d04;
  --accent: #0f766e;
  --line: rgba(31,41,55,0.08);
  --shadow: 0 24px 70px rgba(90, 42, 0, 0.16);
}

* { box-sizing: border-box; }

/* Responsive helper rules */
img, svg { max-width: 100%; height: auto; display: block; }
.container, .page, .shell { box-sizing: border-box; padding-left: 16px; padding-right: 16px; }
.action-btn { min-width: 0; }

body {
  margin: 0;
  font-family:'Manrope',sans-serif;
  color: var(--text);
  min-height:100vh;
  padding:20px;
  background:
    radial-gradient(circle at top left, rgba(232,93,4,0.16), transparent 30%),
    radial-gradient(circle at bottom right, rgba(15,118,110,0.12), transparent 30%),
    linear-gradient(180deg, #fffaf4 0%, #ffe7d8 100%);
  display:flex;
  justify-content:center;
  align-items:center;
}

.shell {
  width:100%;
  max-width: 980px;
  display:grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 18px;
}

.hero {
  border-radius: 30px;
  padding: 28px;
  background: linear-gradient(160deg, rgba(232,93,4,0.95), rgba(251,133,0,0.88));
  color: #fff;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: "";
  position: absolute;
  right: -70px;
  bottom: -70px;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
}

.hero .eyebrow {
  display:inline-flex;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.16);
  font-size: 0.86rem;
  font-weight: 800;
}

.hero h1 {
  margin: 14px 0 10px;
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 0.96;
}

.hero p {
  margin: 0;
  max-width: 38ch;
  line-height: 1.7;
  color: rgba(255,255,255,0.86);
}

.progress-wrap {
  margin-top: 22px;
  padding: 14px;
  border-radius: 20px;
  background: rgba(255,255,255,0.14);
}

.progress-label {
  display:flex;
  justify-content:space-between;
  gap: 12px;
  font-size: 0.9rem;
  margin-bottom: 10px;
  color: rgba(255,255,255,0.88);
}

.progress-bar {
  width:100%;
  height:10px;
  border-radius:999px;
  background: rgba(255,255,255,0.22);
  overflow:hidden;
}

.progress-fill {
  width:50%;
  height:100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #fff, #d1fae5);
}

.panel {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: var(--shadow);
  border-radius: 30px;
  padding: 28px;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 1.7rem;
}

.panel p {
  margin: 0 0 18px;
  color: var(--muted);
  line-height: 1.6;
}

#dynamicFields {
  display:grid;
  gap: 12px;
}

label {
  display:block;
  margin: 2px 0 0;
  font-weight: 800;
  font-size: 0.94rem;
}

input,textarea {
  width:100%;
  padding:14px 15px;
  margin: 8px 0 0;
  border-radius:16px;
  border:1px solid var(--line);
  background: rgba(255,255,255,0.96);
  color: var(--text);
  font-size:15px;
  outline:none;
}

input:focus,textarea:focus {
  border-color: rgba(232,93,4,0.5);
  box-shadow: 0 0 0 4px rgba(232,93,4,0.08);
}

textarea { resize:none; min-height: 108px; }

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding:15px 16px;
  border:none;
  border-radius:16px;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:transform 0.24s ease, box-shadow 0.24s ease;
}

button.primary {
  background: linear-gradient(135deg, #e85d04, #fb8500);
  box-shadow: 0 16px 30px rgba(232,93,4,0.26);
}

button.secondary {
  background: rgba(255,255,255,0.82);
  color: var(--text);
  border: 1px solid rgba(31,41,55,0.08);
  box-shadow: none;
}

button:hover { transform: translateY(-2px); }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; gap: 12px; }
  body { padding: 16px; }
}

@media (max-width: 640px) {
  body { padding: 12px; }
  .hero, .panel { padding: 18px; border-radius: 22px; }
  .hero h1 { font-size: 1.8rem; }
  button { padding: 12px 14px; font-size: 15px; }
}

@media (max-width: 480px) {
  body { padding: 8px; }
  .hero { padding: 16px; }
  .panel { padding: 16px; }
  .hero h1 { font-size: 1.5rem; }
  .hero p { font-size: 0.95rem; }
  input, textarea { padding: 12px 13px; font-size: 14px; }
  button { padding: 11px 12px; font-size: 14px; }
}
</style>
</head>
<body>

<div class="shell">
  <section class="hero">
    <div class="eyebrow">Step 2 of 4 · Personalize it</div>
    <h1>Tell us the details.</h1>
    <p>The form changes based on the template you picked, so you only see the fields you actually need.</p>
    <div class="progress-wrap">
      <div class="progress-label"><span>Step 2 of 4</span><span>50%</span></div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

  </section>

  <section class="panel">
    <h2>Enter your details</h2>
    <p>Keep it short and personal. You can refine the wording on the next step.</p>
    <form id="form">
      <div id="dynamicFields"></div>
      <div class="form-actions">
        <button type="button" class="secondary" onclick="location.href='template-picker.html'">← Back</button>
        <button type="submit" class="primary">Preview wish →</button>
      </div>
    </form>
  </section>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{
  const template = new URLSearchParams(location.search).get("template");
  const container = document.getElementById("dynamicFields");

  const fields = {
    birthday: ["name","age","message","from"],
    anniversary: ["name","years","message","from"],
    love: ["name","message","from"],
    congrats: ["name","achievement","message","from"],
    newbaby: ["babyName","parentName","message","from"],
    wedding: ["bride","groom","message","from"],
    friendship: ["name","message","from"],
    thankyou: ["name","message","from"]
  };

  const labels = {
    name:"Recipient's Name",
    age:"Age",
    years:"Years Together",
    message:"Message",
    from:"Your Name",
    achievement:"Achievement",
    babyName:"Baby Name",
    parentName:"Parent(s) Name",
    bride:"Bride Name",
    groom:"Groom Name"
  };

  if(!template || !fields[template]){
    container.innerHTML = "<p>Please choose a template first.</p>";
    document.getElementById("form").querySelector("button").disabled = true;
    return;
  }

  fields[template].forEach(f=>{
    // Build clearer placeholders per field
    if(f==="message"){
      container.innerHTML += `<label>${labels[f]}</label><textarea id="${f}" required maxlength="300" placeholder="Write a short personal message (max 300 characters)"></textarea>`;
    } else if(f==="age" || f==="years") {
      container.innerHTML += `<label>${labels[f]}</label><input type="number" id="${f}" required min="0" max="150" placeholder="Enter a number (e.g. 30)">`;
    } else {
      // Descriptive placeholders for name-like fields and others
      let ph = "Max 20 characters";
      if(f==="name") ph = "e.g., John Smith";
      if(f==="from") ph = "e.g., Alex";
      if(f==="babyName") ph = "e.g., Baby Liam";
      if(f==="parentName") ph = "e.g., Sarah & Tom";
      if(f==="achievement") ph = "e.g., New job, Graduation";
      if(f==="bride" || f==="groom") ph = "e.g., Jane";
      container.innerHTML += `<label>${labels[f]}</label><input type="text" id="${f}" required maxlength="50" placeholder="${ph}">`;
    }
  });

  const form = document.getElementById("form");
  form.onsubmit = e=>{
    e.preventDefault();
    const data = {};
    fields[template].forEach(f=>{
      let val = document.getElementById(f).value.trim();
      if(f==="name" || f==="babyName" || f==="bride" || f==="groom" || f==="parentName" || f==="from"){
        // limit characters
        val = val.substring(0,50);
      }
      if(f==="age" || f==="years"){
        val = parseInt(val) || 0;
      }
      data[f] = val;
    });

    // Username is first word of name/baby/bride/etc (safe fallback)
    const firstField = data.name || data.babyName || data.bride || data.groom || data.parentName || "";
    data.username = (firstField.split(" ")[0] || "").toLowerCase();

    data.template = template;
    localStorage.setItem("userData", JSON.stringify(data));
    location.href="edit.html";
  };
});
</script>

</body>
</html>
