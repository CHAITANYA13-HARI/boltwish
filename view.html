<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Wish</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family:'Poppins',sans-serif;
  text-align:center;
  background: linear-gradient(135deg,#667eea,#764ba2);
  padding:40px;
}
#data {
  margin:30px auto;
  max-width:450px;
  width:90%;
  padding:35px;
  border-radius:25px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  opacity:0;
  animation: fadeIn 1s forwards;
}
@keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div id="data">Loading your wish...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"YOUR_API_KEY", authDomain:"boltwish-5155c.firebaseapp.com", projectId:"boltwish-5155c"};
const db = getFirestore(initializeApp(firebaseConfig));

const username = new URLSearchParams(location.search).get("user");

async function load(){
  const q = query(collection(db,"users"), where("username","==",username));
  const snap = await getDocs(q);
  if(snap.empty){ document.getElementById("data").innerText="❌ Wish not found"; return; }

  snap.forEach(async doc=>{
    const d = doc.data();
    const res = await fetch(`templates/${d.template}.html`);
    let html = await res.text();
    Object.keys(d).forEach(k=>{
      if(k!=="template" && k!=="timestamp" && k!=="username") html = html.replace(new RegExp(`{{${k}}}`,'g'), d[k]);
    });
    document.getElementById("data").innerHTML = html;
  });
}

load();
</script>

</body>
</html>
