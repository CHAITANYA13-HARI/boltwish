<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Wish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fffaf4;
  --bg-gradient: linear-gradient(135deg, #ffc48a 0%, #ffb347 52%, #ff9f5a 100%);
  --text: #1f2937;
  --muted: #6b7280;
  --shadow: 0 24px 70px rgba(90, 42, 0, 0.15);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  background: 
    radial-gradient(circle at top left, rgba(255,255,255,0.28), transparent 28%),
    radial-gradient(circle at bottom right, rgba(255, 123, 24, 0.22), transparent 30%),
    var(--bg-gradient);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: 0.45;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 520px;
}

#data {
  padding: 0;
  border-radius: 32px;
  background: rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
  overflow: hidden;
  opacity: 0;
  animation: slideIn 0.9s ease both;
}

@keyframes slideIn {
  0% { opacity: 0; transform: translateY(28px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.error-state {
  padding: 48px 28px;
  text-align: center;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(255,255,255,0.7);
}

.error-state h2 {
  font-size: 1.3rem;
  margin-bottom: 12px;
  color: #d97706;
}

.error-state p {
  color: var(--muted);
  font-size: 0.95rem;
}

@media (max-width: 640px) {
  body { padding: 12px; }
  #data { border-radius: 24px; }
}
</style>
</head>
<body>

<div class="container">
  <div id="data">
    <div class="error-state">
      <h2>Loading your wish...</h2>
      <p>Please wait while we fetch your card.</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = { 
  apiKey:"YOUR_API_KEY", 
  authDomain:"boltwish-5155c.firebaseapp.com", 
  projectId:"boltwish-5155c"
};

const db = getFirestore(initializeApp(firebaseConfig));
const username = location.pathname.split("/").pop();

if(!username){
  document.getElementById("data").innerHTML = `<div class="error-state"><h2>❌ Invalid URL</h2><p>No wish ID found in the link.</p></div>`;
  throw new Error("No username in URL");
}

async function loadWish(){
  try {
    const q = query(collection(db,"users"), where("username","==",username));
    const snap = await getDocs(q);

    if(snap.empty){
      document.getElementById("data").innerHTML = `<div class="error-state"><h2>❌ Wish Not Found</h2><p>This wish may have expired or the link is incorrect.</p></div>`;
      return;
    }

    snap.forEach(async doc => {
      const d = doc.data();
      const res = await fetch(`/templates/${d.template}.html`);
      
      if(!res.ok){
        document.getElementById("data").innerHTML = `<div class="error-state"><h2>❌ Template Error</h2><p>We couldn't load the template for this wish.</p></div>`;
        return;
      }

      let html = await res.text();
      Object.keys(d).forEach(k => {
        if(!["template","timestamp","username"].includes(k)){
          html = html.replace(new RegExp(`{{${k}}}`, 'g'), d[k]);
        }
      });

      document.getElementById("data").innerHTML = html;
    });

  } catch(e){
    console.error("Error loading wish:", e);
    document.getElementById("data").innerHTML = `<div class="error-state"><h2>❌ Error</h2><p>Something went wrong loading your wish.</p></div>`;
  }
}

loadWish();
</script>

</body>
</html>
