<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saving...</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background: linear-gradient(135deg,#667eea,#764ba2);
  margin:0;
  flex-direction:column;
  color:white;
  padding: 20px;
  box-sizing: border-box;
  text-align:center;
}

#status {
  font-size:clamp(1.2rem, 4vw, 1.5rem);
  margin-bottom:25px;
}

.loader {
  width: clamp(40px, 10vw, 60px);
  height: clamp(40px, 10vw, 60px);
  border: 6px solid rgba(255,255,255,0.2);
  border-top: 6px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

button {
  display:none;
  padding: clamp(10px,2vw,14px) clamp(20px,4vw,25px);
  border:none;
  border-radius:12px;
  background: #fff;
  color: #667eea;
  font-weight:bold;
  cursor:pointer;
  font-size: clamp(14px,3vw,16px);
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
  transition: transform 0.3s, opacity 0.3s;
  margin: 8px 0;
  min-width: 200px;
}
button:hover { transform: translateY(-3px); opacity:0.9; }

/* Mobile responsive tweaks */
@media (max-width: 480px) {
  #status {
    margin-bottom: 20px;
  }
  button {
    min-width: 160px;
    font-size: 14px;
    padding: 10px 18px;
  }
}
</style>
</head>
<body>

<div class="loader" id="loader"></div>
<div id="status">Saving your wish...</div>
<button id="openBtn">🚀 Open Your Wish</button>
<button id="shareBtn">📤 Share Your Wish</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

// 🔹 Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "boltwish-5155c.firebaseapp.com",
  projectId: "boltwish-5155c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔹 Get data from localStorage
const data = JSON.parse(localStorage.getItem("finalData"));
if(!data || Object.keys(data).length === 0){
  document.getElementById("status").innerText="❌ Missing data";
  document.getElementById("loader").style.display="none";
  throw new Error("No valid data in localStorage");
}

// 🔹 Create friendly username
const baseName = data.name || data.babyName || data.bride || data.groom || data.parentName || "user";
const username = `${baseName.toLowerCase().replace(/\s+/g,"-")}-${Date.now().toString().slice(-4)}`;

// 🔹 Save to Firestore
addDoc(collection(db,"users"), {
  ...data,
  username,
  timestamp: serverTimestamp()
})
.then(()=>{
  document.getElementById("loader").style.display="none";
  const status = document.getElementById("status");
  const url = `${location.origin}/wish/${username}`;

  // 🔹 Copy URL
  navigator.clipboard.writeText(url).catch(()=>{});

  // 🔹 Open button
  const openBtn = document.getElementById("openBtn");
  openBtn.style.display="inline-block";
  openBtn.onclick = ()=> window.open(url,"_blank");

  // 🔹 Share button
  const shareBtn = document.getElementById("shareBtn");
  shareBtn.style.display="inline-block";
  shareBtn.onclick = async () => {
    try {
      if (navigator.share) {
        await navigator.share({
          title: "My Wish 🎉",
          text: "Check out my personalized wish!",
          url
        });
      } else {
        await navigator.clipboard.writeText(url);
        alert("Link copied to clipboard! 📋");
      }
    } catch(e){
      console.warn("Share failed:", e);
      await navigator.clipboard.writeText(url);
      alert("Unable to share automatically. URL copied to clipboard!");
    }
  };

  status.innerText = "✅ Your wish is ready!";
  localStorage.removeItem("finalData");
})
.catch(err=>{
  console.error("FIRESTORE ERROR:", err);
  document.getElementById("loader").style.display="none";
  document.getElementById("status").innerText="❌ Error saving data";
  alert("Error: " + err.message);
});
</script>

</body>
</html>
