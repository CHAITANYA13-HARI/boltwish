<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saving...</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
#status {
  font-size:2rem;
  margin-bottom:18px;
  line-height:1.3;
}

.loader {
  width:80px;
  height:80px;
  border:8px solid rgba(255,255,255,0.2);
  border-top:8px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:25px;
}

.progress-wrap {
  margin: 0 auto 22px;
  width: 100%;
  max-width: 420px;
  padding: 14px;
  border-radius: 20px;
  background: rgba(255,255,255,0.12);
}

.progress-label {
  display:flex;
  justify-content:space-between;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 0.92rem;
}

.progress-bar {
  width:100%;
  height:10px;
  border-radius:999px;
  background: rgba(255,255,255,0.18);
  overflow:hidden;
}

.progress-fill {
  width:100%;
  height:100%;
  border-radius:inherit;
  background: linear-gradient(90deg, #fff, #d1fae5);
}
@keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }

button {
  display:none;
  padding:15px 25px;
  border:none;
  border-radius:12px;
  background:#fff;
  color:#667eea;
  font-weight:bold;
  cursor:pointer;
  font-size:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transition:transform 0.3s,opacity 0.3s;
  margin:10px 0;
  width:250px;
}
button:hover { transform: translateY(-3px); opacity:0.9; }

:root {
  --text: #fff;
  --muted: rgba(255,255,255,0.8);
  --brand: #e85d04;
}

@media (max-width: 640px) {
  .shell { padding: 20px 16px; }
  #status { font-size: 1.8rem; }
  .loader { width: 70px; height: 70px; }
  .progress-wrap { padding: 12px; }
  .progress-label { font-size: 0.88rem; }
}

@media (max-width: 480px) {
  .shell { padding: 16px 12px; }
  #status { font-size: 1.5rem; margin-bottom: 16px; }
  .loader { width: 60px; height: 60px; border-width: 5px; }
  .progress-wrap { max-width: 100%; padding: 10px; margin: 0 auto 18px; }
  .progress-label { font-size: 0.82rem; }
  button { width: 95%; font-size: 15px; padding: 10px 0; }
}
</style>
</head>
<body>

<div class="shell">
  <div class="loader" id="loader"></div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Step 4 of 4</span><span>100%</span></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
  <div id="status">Saving your wish...</div>
  <button id="openBtn">🚀 Open Your Wish</button>
  <button id="shareBtn">📤 Share Your Wish</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

// 🔹 Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "boltwish-5155c.firebaseapp.com",
  projectId: "boltwish-5155c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔹 Get data
const data = JSON.parse(localStorage.getItem("finalData"));
if(!data || Object.keys(data).length===0){
  document.getElementById("status").innerText="❌ Missing data";
  document.getElementById("loader").style.display="none";
  throw new Error("No valid data in localStorage");
}

// 🔹 Create friendly username
const baseName = data.name || data.babyName || data.bride || data.groom || data.parentName || "user";
const username = `${baseName.toLowerCase().replace(/\s+/g,"-")}-${Date.now().toString().slice(-4)}`;

// 🔹 Save to Firestore
addDoc(collection(db,"users"),{...data,username,timestamp:serverTimestamp()})
.then(()=>{
  document.getElementById("loader").style.display="none";
  const status = document.getElementById("status");
  const url = `${location.origin}/wish/${username}`;

  // Copy link
  navigator.clipboard.writeText(url).catch(()=>{});

  localStorage.setItem("lastWishLink", url);
  localStorage.setItem("lastWishMeta", JSON.stringify({
    username,
    template: data.template,
    templateLabel: data.template ? data.template.charAt(0).toUpperCase() + data.template.slice(1) : "Wish"
  }));

  // Open button
  const openBtn = document.getElementById("openBtn");
  openBtn.style.display="inline-block";
  openBtn.onclick = ()=> window.open(url,"_blank");

  // Share button
  const shareBtn = document.getElementById("shareBtn");
  shareBtn.style.display="inline-block";
  shareBtn.onclick = async ()=>{
    try {
      if(navigator.share){
        await navigator.share({title:"My Wish 🎉",text:"Check out my wish!",url});
      } else {
        await navigator.clipboard.writeText(url);
        alert("Link copied! 📋");
      }
    } catch(e){
      await navigator.clipboard.writeText(url);
      alert("Unable to share automatically. URL copied! 📋");
    }
  };

  status.innerText="✅ Your wish is ready!";
  localStorage.removeItem("finalData");
})
.catch(err=>{
  console.error("FIRESTORE ERROR:",err);
  document.getElementById("loader").style.display="none";
  document.getElementById("status").innerText="❌ Error saving data";
  alert("Error: "+err.message);
});
</script>

</body>
</html>
