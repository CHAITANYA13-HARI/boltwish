<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saving...</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --text: #1f2937;
  --muted: #6b7280;
  --brand: #e85d04;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Manrope', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(232,93,4,0.15), transparent 30%),
    radial-gradient(circle at bottom right, rgba(15,118,110,0.12), transparent 26%),
    linear-gradient(180deg, #fffaf4 0%, #ffe7d8 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  color: var(--text);
  padding: 24px 16px 36px;
}

.topbar {
  width: 100%;
  max-width: 520px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
}

.topbar-back {
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  background: rgba(255,255,255,0.7);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.24s ease;
  display: none;
}

.topbar-back:hover {
  background: rgba(255,255,255,0.9);
  transform: translateX(-2px);
}

.container {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.68);
  backdrop-filter: blur(12px);
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.72);
  box-shadow: 0 20px 60px rgba(90, 42, 0, 0.14);
  padding: 32px 24px;
  text-align: center;
  animation: slideInUp 0.4s ease;
}

@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.progress-wrap {
  margin: 0 0 24px;
  padding: 14px;
  border-radius: 18px;
  background: rgba(232,93,4,0.08);
}

.progress-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 600;
}

.progress-bar {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(31,41,55,0.08);
  overflow: hidden;
}

.progress-fill {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brand), #2dd4bf);
}

.loader {
  width: 80px;
  height: 80px;
  border: 8px solid rgba(232,93,4,0.15);
  border-top: 8px solid var(--brand);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 24px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#status {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 24px;
  line-height: 1.3;
  color: var(--text);
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 24px;
}

button {
  display: none;
  padding: 14px 24px;
  border: none;
  border-radius: 16px;
  font-weight: 800;
  cursor: pointer;
  font-size: 16px;
  transition: transform 0.24s ease, box-shadow 0.24s ease;
}

button.primary {
  background: linear-gradient(135deg, #e85d04, #fb8500);
  color: white;
  box-shadow: 0 16px 30px rgba(232,93,4,0.26);
}

button.secondary {
  background: rgba(255,255,255,0.82);
  color: var(--text);
  border: 1px solid rgba(31,41,55,0.08);
  box-shadow: none;
}

button:hover {
  transform: translateY(-2px);
}

button.primary:hover {
  box-shadow: 0 20px 40px rgba(232,93,4,0.32);
}

@media (max-width: 640px) {
  body { padding: 20px 16px 32px; }
  .container { padding: 24px 18px; border-radius: 24px; }
  .loader { width: 70px; height: 70px; }
  #status { font-size: 1.3rem; }
  button { padding: 12px 20px; font-size: 15px; }
}

@media (max-width: 480px) {
  body { padding: 16px 12px 28px; }
  .container { padding: 20px 16px; border-radius: 20px; }
  .loader { width: 60px; height: 60px; border-width: 5px; }
  #status { font-size: 1.2rem; margin-bottom: 18px; }
  .progress-wrap { padding: 10px; margin-bottom: 18px; }
  button { width: 100%; padding: 10px 16px; font-size: 14px; }
  .button-group { gap: 8px; }
}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" id="backBtn" onclick="location.href='index.html'">← Back to home</button>
  <div style="flex: 1;"></div>
</div>

<div class="container">
  <div class="progress-wrap">
    <div class="progress-label"><span>Step 4 of 4</span><span>100%</span></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
  
  <div class="loader" id="loader"></div>
  <div id="status">Saving your wish...</div>
  
  <div class="button-group">
    <button id="openBtn" class="primary">🚀 Open Your Wish</button>
    <button id="shareBtn" class="secondary">📤 Share Your Wish</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

// 🔹 Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "boltwish-5155c.firebaseapp.com",
  projectId: "boltwish-5155c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔹 Get data
const data = JSON.parse(localStorage.getItem("finalData"));
if(!data || Object.keys(data).length===0){
  document.getElementById("status").innerText="❌ Missing data";
  document.getElementById("loader").style.display="none";
  throw new Error("No valid data in localStorage");
}

// 🔹 Create friendly username
const baseName = data.name || data.babyName || data.bride || data.groom || data.parentName || "user";
const username = `${baseName.toLowerCase().replace(/\s+/g,"-")}-${Date.now().toString().slice(-4)}`;

// 🔹 Save to Firestore
addDoc(collection(db,"users"),{...data,username,timestamp:serverTimestamp()})
.then(()=>{
  document.getElementById("loader").style.display="none";
  const status = document.getElementById("status");
  const url = `${location.origin}/wish/${username}`;

  // Copy link
  navigator.clipboard.writeText(url).catch(()=>{});

  localStorage.setItem("lastWishLink", url);
  localStorage.setItem("lastWishMeta", JSON.stringify({
    username,
    template: data.template,
    templateLabel: data.template ? data.template.charAt(0).toUpperCase() + data.template.slice(1) : "Wish"
  }));

  // Show back button
  document.getElementById("backBtn").style.display = "inline-block";

  // Open button
  const openBtn = document.getElementById("openBtn");
  openBtn.style.display="block";
  openBtn.onclick = ()=> window.open(url,"_blank");

  // Share button
  const shareBtn = document.getElementById("shareBtn");
  shareBtn.style.display="block";
  shareBtn.onclick = async ()=>{
    try {
      if(navigator.share){
        await navigator.share({title:"My Wish 🎉",text:"Check out my wish!",url});
      } else {
        await navigator.clipboard.writeText(url);
        alert("Link copied! 📋");
      }
    } catch(e){
      await navigator.clipboard.writeText(url);
      alert("Unable to share automatically. URL copied! 📋");
    }
  };

  status.innerText="✅ Your wish is ready!";
  localStorage.removeItem("finalData");
})
.catch(err=>{
  console.error("FIRESTORE ERROR:",err);
  document.getElementById("loader").style.display="none";
  document.getElementById("status").innerText="❌ Error saving data";
  alert("Error: "+err.message);
});
</script>

</body>
</html>
